<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saba AI</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1>Saba AI</h1>
      <button id="new-chat-btn" type="button">New chat</button>
    </div>
    <div id="messages" class="messages"></div>
    <form id="chat-form">
      <label id="file-label" for="file-input" title="Attach a file">📎</label>
      <input id="file-input" type="file" hidden />
      <input id="user-input" type="text" placeholder="Type a message..." autocomplete="off" required />
      <button type="submit">Send</button>
    </form>
    <div id="file-preview" class="file-preview hidden"></div>
  </div>
  <script src="/static/script.js"></script>
</body>
</html>
